<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!--
  connect-src nennt das Schema AUSDRUECKLICH, nicht nur 'self'.

  WebKit - also jedes Safari und alles auf einem iPhone - rechnet 'self' bei
  WebSockets nicht auf wss:// an. Die Seite laedt dann ganz normal, und die
  Verbindung zum Leuchtturm wird stumm verworfen: Bild und Zahlen bleiben leer,
  ohne dass irgendwo etwas steht. Am Schreibtisch faellt es nicht auf, weil
  Chromium und Firefox es grosszuegiger auslegen.

  Die engere Fassung mit dem genauen Wirtsnamen setzt Caddy als Kopfzeile dazu;
  beide Regeln gelten dann gleichzeitig, und es gilt die Schnittmenge.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' wss: ws:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">

<title>FrameFlip</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FrameFlip">

<style>
  :root {
    --bg: #07070d;      --panel: #0b0b14;   --stage: #05050a;
    --surface: #11111b; --line: #1e1e2b;    --ink: #f4f4f8;
    --muted: #9b9bb0;   --faint: #6b6b80;   --accent: #a855f7;
    --blue: #60a5fa;    --cyan: #22d3ee;    --warn: #f472b6;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }

  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ------------------------------------------------------------- Kopfzeile */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none;
  }

  .mark { font-weight: 650; letter-spacing: .04em; font-size: 14px; }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--faint); flex: none;
    transition: background .3s, box-shadow .3s;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .dot.idle { background: var(--blue); }
  .dot.gone { background: var(--warn); }

  .standing {
    font-size: 11px; color: var(--muted);
    margin-left: auto; text-align: right;
  }

  /* ------------------------------------------------------------- Rumpf */
  main {
    flex: 1; min-height: 0;
    display: grid; gap: 1px;
    background: var(--line);
    grid-template-rows: auto 1fr;
  }

  /* Quer und am Schreibtisch nebeneinander, hoch untereinander. Die Schwelle
     liegt am Seitenverhaeltnis, nicht an der Breite: Ein Handy im Querformat ist
     schmal und hat trotzdem Platz fuer zwei Spalten. */
  @media (min-aspect-ratio: 1/1) {
    main { grid-template-rows: 1fr; grid-template-columns: 1fr minmax(250px, 320px); }
  }

  /* ------------------------------------------------------------- Bühne */
  .stage {
    position: relative; background: var(--stage);
    display: flex; align-items: center; justify-content: center;
    min-height: 0; overflow: hidden; touch-action: none;
  }

  .stage img {
    max-width: 100%; max-height: 100%;
    display: block; transform-origin: 0 0;
    image-rendering: auto; user-select: none; -webkit-user-drag: none;
  }
  .stage img.grabbing { cursor: grabbing; }
  .stage img.grab { cursor: grab; }

  .stage .empty {
    color: var(--faint); font-size: 12px;
    text-align: center; padding: 24px; line-height: 1.7; max-width: 30em;
  }

  /* Werkzeuge auf der Bühne - erscheinen nur, wenn es ein Bild gibt. */
  .tools {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: none; align-items: center; gap: 2px; padding: 4px;
    background: rgba(11, 11, 20, .86); border: 1px solid var(--line);
    border-radius: 11px; backdrop-filter: blur(8px);
  }
  .tools.on { display: flex; }

  .tools button {
    min-width: 32px; height: 30px; padding: 0 8px;
    background: transparent; border: 0; border-radius: 8px;
    color: var(--muted); font-family: var(--mono); font-size: 13px;
    cursor: pointer; line-height: 1;
  }
  .tools button:hover { background: var(--surface); color: var(--ink); }
  .tools button:active { background: var(--line); }
  .tools .level {
    min-width: 46px; text-align: center; color: var(--faint);
    font-size: 10.5px; font-family: var(--mono); cursor: default;
  }
  .tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }

  /* ------------------------------------------------------------- Seite */
  .side {
    background: var(--panel);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 18px 14px;
  }

  /* ---------------------------------------------------- Zustand & Fortschritt */
  .state { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

  .chip {
    font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px; font-weight: 600;
    color: var(--faint); background: var(--surface); border: 1px solid var(--line);
    white-space: nowrap;
  }
  .chip.live {
    color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .chip.idle { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }

  .scene {
    font-size: 11.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .headline { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }

  .headline .pct {
    font-family: var(--mono); font-size: 34px; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .headline .pct small { font-size: 15px; color: var(--faint); margin-left: 2px; }

  .headline .frames {
    margin-left: auto; text-align: right;
    font-family: var(--mono); font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .headline .frames b { color: var(--ink); font-weight: 500; }

  .bar {
    height: 6px; border-radius: 3px; background: var(--surface);
    overflow: hidden; position: relative;
  }
  .bar i {
    position: absolute; inset: 0 auto 0 0; display: block;
    background: linear-gradient(90deg, var(--accent), var(--cyan));
    width: 0; transition: width .45s ease; border-radius: 3px;
  }

  .times {
    display: flex; justify-content: space-between;
    margin: 7px 0 16px; font-size: 10px; color: var(--faint);
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .times b { color: var(--muted); font-weight: 400; }

  /* ------------------------------------------------------------- Zahlen */
  .grid {
    display: grid; gap: 13px 16px;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
  }

  .cell label {
    display: block; font-size: 8.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 3px;
  }
  .cell output {
    font-family: var(--mono); font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }

  .rule { grid-column: 1 / -1; height: 1px; background: var(--line); margin: 1px 0; }

  /* Die Fussnote gehoert unter die Zahlen, nicht in einen eigenen Balken quer
     ueber die Seite: Sie ist eine Randbemerkung, kein Bedienelement. */
  .note {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 9.5px; line-height: 1.6; color: var(--faint);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .note button {
    background: transparent; border: 0; padding: 0;
    color: var(--faint); font-size: 9.5px; text-decoration: underline;
    cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .note button:hover { color: var(--muted); }

  /* ------------------------------------------------------------- Kennwort */
  .ask {
    position: fixed; inset: 0; z-index: 10;
    /* Deckend, nicht durchscheinend: Wer nach einem Kennwort gefragt wird, soll
       nichts sehen, was er ohne Kennwort nicht sehen duerfte. */
    background: var(--bg);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .ask.on { display: flex; }

  .ask form {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 320px;
    text-align: center;
  }
  .ask h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .ask p  { margin: 0 0 18px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }

  .ask input {
    width: 100%; padding: 11px 12px; text-align: center;
    font-family: var(--mono); font-size: 16px; letter-spacing: .1em;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 9px;
  }
  .ask input:focus { outline: none; border-color: var(--accent); }

  .ask button[type=submit] {
    width: 100%; margin-top: 12px; padding: 11px;
    font-size: 12px; font-weight: 600; letter-spacing: .04em;
    color: #0b0b14; background: var(--accent);
    border: 0; border-radius: 9px; cursor: pointer;
  }
  .ask .wrong { color: var(--warn); font-size: 11px; margin: 12px 0 0; min-height: 14px; }
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="mark">FrameFlip</span>
  <span class="standing" id="standing">verbinde …</span>
</header>

<main>
  <div class="stage" id="stage">
    <div class="empty" id="empty">Noch kein Bild.</div>

    <div class="tools" id="tools">
      <button id="zoomOut" title="Kleiner" aria-label="Kleiner">−</button>
      <span class="level" id="level">100 %</span>
      <button id="zoomIn" title="Größer" aria-label="Größer">+</button>
      <span class="sep"></span>
      <button id="zoomReset" title="Einpassen" aria-label="Einpassen">⤢</button>
      <button id="save" title="Bild sichern" aria-label="Bild sichern">↓</button>
    </div>
  </div>

  <div class="side">
    <div class="state">
      <span class="chip" id="chip">wartet</span>
      <span class="scene" id="scene"></span>
    </div>

    <div class="headline">
      <span class="pct" id="percent">–<small>%</small></span>
      <span class="frames" id="frames">–</span>
    </div>

    <div class="bar"><i id="barFill"></i></div>

    <div class="times">
      <span>gelaufen <b id="elapsed">–</b></span>
      <span>verbleibend <b id="remaining">–</b></span>
    </div>

    <div class="grid">
      <div class="cell"><label>Je Bild</label><output id="spf">–</output></div>
      <div class="cell"><label>Geschrieben</label><output id="written">–</output></div>
      <div class="cell"><label>Samples</label><output id="sample">–</output></div>

      <div class="rule"></div>

      <div class="cell"><label>Auflösung</label><output id="size">–</output></div>
      <div class="cell"><label>Speicher</label><output id="memory">–</output></div>
      <div class="cell"><label>RAM frei</label><output id="ram">–</output></div>

      <div class="rule"></div>

      <div class="cell"><label>CPU</label><output id="cpu">–</output></div>
      <div class="cell"><label>GPU</label><output id="gpu">–</output></div>
    </div>

    <div class="note">
      <span>Nur Ansicht · Ende zu Ende verschlüsselt</span>
      <button id="forget" title="Zugang von diesem Gerät entfernen">Zugang entfernen</button>
    </div>
  </div>
</main>

<div class="ask" id="ask">
  <form id="askForm" autocomplete="off">
    <h2>Kennwort</h2>
    <p>Die freien Plätze sind belegt. Für einen weiteren braucht es das Kennwort, das am PC steht.</p>
    <input id="askInput" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" spellcheck="false" aria-label="Kennwort">
    <button type="submit">Zusehen</button>
    <p class="wrong" id="askWrong"></p>
  </form>
</div>

<script>
"use strict";

/* ===========================================================================
   Das Protokoll steht in PROTOCOL.md des Relays. Diese Datei ist die zweite
   Umsetzung davon - die erste ist FrameFlip selbst. Jede Abweichung hier ist ein
   Bruch der Schnittstelle, kein Detail.

   Was der Server dabei erfaehrt: eine Raumkennung. Sonst nichts. Das Geheimnis
   steht hinter der Raute der Adresse, und diesen Teil schickt ein Browser
   grundsaetzlich nicht mit - nicht im Aufruf, nicht im Referrer, nirgends.
   =========================================================================== */

const SEATS       = 6;                        // muss zu WatchKey.Seats passen
const FREE_SEATS  = 2;                        // ... und zu WatchKey.FreeSeats
const ROOM_INFO   = "frameflip/v1/watchroom";
const SEAT_INFO   = "frameflip/v1/watchseat";
const HOST_INFO   = "frameflip/v1/host";
const CLIENT_INFO = "frameflip/v1/client";
const CONFIRM_INFO = "frameflip/v2/confirm";

const VERSION = 2;
const SALT_BYTES = 16, TAG_BYTES = 16, COUNTER_BYTES = 8, NONCE_BYTES = 12;
const OVERHEAD = COUNTER_BYTES + TAG_BYTES;

const KIND_JSON = 0x01, KIND_PREVIEW = 0x02;

const enc = new TextEncoder();

/* ------------------------------------------------------------------ Kleinkram */

function fromBase64Url(text) {
  let s = String(text).replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";

  const raw = atob(s);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

const toHex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");

async function hkdf(secret, info, salt, bytes) {
  const key = await crypto.subtle.importKey("raw", secret, "HKDF", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "HKDF", hash: "SHA-256", salt: salt, info: enc.encode(info) }, key, bytes * 8);

  return new Uint8Array(bits);
}

/* Der Nachweis, dass die Gegenseite denselben Schluessel hat. Bindet beide Salze
   und die Rolle, damit ein Platzhalter im Raum nicht als echtes Geraet durchgeht. */
async function confirmation(seatKey, senderIsHost, hostSalt, clientSalt) {
  const info = enc.encode(CONFIRM_INFO);
  const transcript = new Uint8Array(info.length + 1 + SALT_BYTES * 2);

  transcript.set(info, 0);
  transcript[info.length] = senderIsHost ? 1 : 2;
  transcript.set(hostSalt, info.length + 1);
  transcript.set(clientSalt, info.length + 1 + SALT_BYTES);

  const key = await crypto.subtle.importKey(
    "raw", seatKey, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);

  return new Uint8Array(await crypto.subtle.sign("HMAC", key, transcript));
}

function sameBytes(a, b) {
  if (a.length !== b.length) return false;

  // Ohne fruehen Ausstieg. Hier haengt zwar nichts Geheimes an der Laufzeit, aber
  // ein Vergleich von Pruefsummen, der bei der ersten Abweichung aufhoert, ist eine
  // Angewohnheit, die man sich an der falschen Stelle teuer bezahlt.
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a[i] ^ b[i];
  return diff === 0;
}

/* ------------------------------------------------------- Der verschluesselte Kanal */

class Channel {
  constructor(sendKey, receiveKey) {
    this.sendKey = sendKey;
    this.receiveKey = receiveKey;
    this.next = 0n;
    this.lastSeen = 0n;
    this.sawAny = false;
  }

  static async establish(seatKey, hostSalt, clientSalt) {
    const salt = new Uint8Array(SALT_BYTES * 2);
    salt.set(hostSalt, 0);
    salt.set(clientSalt, SALT_BYTES);

    // Wir sind der Client: Wir senden mit dem Client-Schluessel und lesen den des Hosts.
    const mine  = await hkdf(seatKey, CLIENT_INFO, salt, 32);
    const yours = await hkdf(seatKey, HOST_INFO, salt, 32);

    const usable = raw => crypto.subtle.importKey(
      "raw", raw, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);

    return new Channel(await usable(mine), await usable(yours));
  }

  async seal(payload) {
    const frame = new Uint8Array(OVERHEAD + payload.length);
    new DataView(frame.buffer).setBigUint64(0, this.next++, false);

    const nonce = new Uint8Array(NONCE_BYTES);
    nonce.set(frame.subarray(0, COUNTER_BYTES), NONCE_BYTES - COUNTER_BYTES);

    const sealed = new Uint8Array(await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: nonce, additionalData: frame.subarray(0, COUNTER_BYTES), tagLength: 128 },
      this.sendKey, payload));

    // WebCrypto haengt die Pruefsumme hinten an, auf der Leitung steht sie vorn.
    frame.set(sealed.subarray(sealed.length - TAG_BYTES), COUNTER_BYTES);
    frame.set(sealed.subarray(0, sealed.length - TAG_BYTES), OVERHEAD);

    return frame;
  }

  async open(frame) {
    if (frame.length < OVERHEAD) return null;

    const counter = new DataView(frame.buffer, frame.byteOffset, frame.byteLength).getBigUint64(0, false);
    if (this.sawAny && counter <= this.lastSeen) return null;

    const nonce = new Uint8Array(NONCE_BYTES);
    nonce.set(frame.subarray(0, COUNTER_BYTES), NONCE_BYTES - COUNTER_BYTES);

    const body = new Uint8Array(frame.length - OVERHEAD + TAG_BYTES);
    body.set(frame.subarray(OVERHEAD), 0);
    body.set(frame.subarray(COUNTER_BYTES, OVERHEAD), frame.length - OVERHEAD);

    let plain;
    try {
      plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: nonce, additionalData: frame.subarray(0, COUNTER_BYTES), tagLength: 128 },
        this.receiveKey, body);
    } catch (e) {
      return null;   // falscher Schluessel oder verfaelscht - beides derselbe Fall
    }

    // Erst jetzt weiterzaehlen. Andernfalls koennte ein Fremder mit einer erfundenen
    // hohen Zahl die echte Gegenseite fuer den Rest der Sitzung aussperren.
    this.lastSeen = counter;
    this.sawAny = true;

    return new Uint8Array(plain);
  }
}

/* --------------------------------------------------------------- Das Geheimnis */

/* Aus der Adresse holen und sofort daraus entfernen.

   Der Sinn ist handfest: Danach steht in der Adresszeile nur noch der Pfad. Ein
   Screenshot vom Handy verraet nichts, der Verlauf behaelt nichts, und wer kurz
   ueber die Schulter sieht, sieht nichts.

   Abgelegt wird im localStorage, nicht nur fuer die Sitzung. Das ist noetig, damit
   die Seite sich installieren laesst: Ein installiertes Programm startet unter
   seiner eigenen Adresse, ohne Raute - ohne bleibende Ablage waere es bei jedem
   Start leer. Wer das nicht will, hat unten "Zugang entfernen". */
const KEY_SECRET = "frameflip.watch.key";
const KEY_CODE = "frameflip.watch.code";

function keep(name, value) {
  try {
    if (value) localStorage.setItem(name, value);
    else localStorage.removeItem(name);
  } catch (e) { /* privates Fenster: dann eben nur fuer diesen Besuch */ }
}

function kept(name) {
  try { return localStorage.getItem(name) || ""; } catch (e) { return ""; }
}

function secretFromAddress() {
  const raw = location.hash.replace(/^#/, "").trim();

  if (raw) {
    keep(KEY_SECRET, raw);

    // Ein neuer Link heisst auch: das alte Kennwort passt womoeglich nicht mehr.
    keep(KEY_CODE, "");

    history.replaceState(null, "", location.pathname);
    return raw;
  }

  return kept(KEY_SECRET);
}

const rememberedCode = () => kept(KEY_CODE);
const rememberCode = code => keep(KEY_CODE, code);

/* ------------------------------------------------------------------- Anzeige */

const el = id => document.getElementById(id);
const dot = el("dot"), standing = el("standing"), stage = el("stage"), empty = el("empty");
const tools = el("tools"), level = el("level");

let picture = null;      // das <img>, sobald es eines gibt
let pictureUrl = null;   // seine derzeitige blob-Adresse
let lastJpeg = null;     // die Bytes, fuer das Sichern
let lastState = null;

function say(text, mood) {
  standing.textContent = text;
  dot.className = "dot" + (mood ? " " + mood : "");
}

function clock(seconds) {
  if (seconds === undefined || seconds === null) return "–";

  const s = Math.max(0, Math.round(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;

  return h > 0
    ? h + ":" + String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0")
    : m + ":" + String(r).padStart(2, "0");
}

const put = (id, text) => { el(id).textContent = text; };

function show(state) {
  lastState = state;

  const has = name => state[name] !== undefined && state[name] !== null;
  const läuft = state.rendering === true;

  el("chip").className = "chip " + (läuft ? "live" : "idle");
  el("chip").textContent = läuft ? (state.activity || "rendert") : "bereit";

  el("scene").textContent = state.scene || "";

  el("percent").innerHTML = has("percent")
    ? state.percent.toFixed(1) + "<small>%</small>"
    : "–<small>%</small>";

  el("barFill").style.width = (has("percent") ? Math.min(100, state.percent) : 0) + "%";

  el("frames").innerHTML = has("frame")
    ? "<b>" + state.frame + "</b>" + (has("last") ? " / " + state.last : "")
    : "–";

  put("elapsed", clock(state.elapsed));
  put("remaining", läuft && has("remaining") ? clock(state.remaining) : "–");
  put("spf", has("secondsPerFrame") ? state.secondsPerFrame.toFixed(2) + " s" : "–");
  put("written", has("written") ? String(state.written) : "–");

  put("sample", has("sample")
    ? state.sample + (has("sampleTotal") ? " / " + state.sampleTotal : "")
    : "–");

  put("size", has("width") && has("height") ? state.width + " × " + state.height : "–");
  put("memory", has("memoryMb") ? Math.round(state.memoryMb) + " MB" : "–");
  put("cpu", has("cpu") ? state.cpu.toFixed(0) + " %" : "–");
  put("gpu", has("gpu") ? state.gpu.toFixed(0) + " %" : "–");

  put("ram", has("freeMb")
    ? (state.freeMb / 1024).toFixed(1) + (has("totalMb") ? " / " + (state.totalMb / 1024).toFixed(0) : "") + " GB"
    : "–");

  say(läuft ? (state.activity || "rendert") : "bereit", läuft ? "live" : "idle");
}

function showPicture(jpeg) {
  lastJpeg = jpeg;

  const next = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));

  if (!picture) {
    picture = document.createElement("img");
    picture.alt = "";
    picture.addEventListener("dblclick", () => setZoom(scale > 1 ? 1 : 2));
    stage.appendChild(picture);
  }

  picture.src = next;
  empty.style.display = "none";
  tools.classList.add("on");

  // Die alte Adresse erst freigeben, wenn die neue steht - sonst blitzt es weiss auf.
  const old = pictureUrl;
  pictureUrl = next;
  if (old) setTimeout(() => URL.revokeObjectURL(old), 1000);
}

/* Alles vom Bildschirm nehmen.

   Wird gerufen, bevor nach einem Kennwort gefragt wird. Ohne das staende hinter der
   Abfrage noch, was eine fruehere Verbindung geliefert hat - und ein Kennwort, das
   man umgehen kann, indem man dahinterschaut, ist keines. */
function blank() {
  if (picture) { picture.remove(); picture = null; }
  if (pictureUrl) { URL.revokeObjectURL(pictureUrl); pictureUrl = null; }

  lastJpeg = null;
  lastState = null;

  tools.classList.remove("on");
  empty.style.display = "";
  empty.textContent = "Noch kein Bild.";

  setZoom(1);

  el("chip").className = "chip";
  el("chip").textContent = "wartet";
  el("scene").textContent = "";
  el("percent").innerHTML = "–<small>%</small>";
  el("frames").textContent = "–";
  el("barFill").style.width = "0%";

  for (const id of ["elapsed", "remaining", "spf", "written", "sample", "size", "memory", "cpu", "gpu", "ram"]) {
    put(id, "–");
  }
}

/* ---------------------------------------------------------- Näher heransehen */

/* Die Verschiebung rechnet gegen die MITTE der Bühne, nicht gegen den Kasten des
   Bildes: Der Kasten wandert ja mit der Verschiebung, und wer gegen ihn rechnet,
   jagt seinem eigenen Ergebnis hinterher. */
let scale = 1, tx = 0, ty = 0;

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function apply() {
  if (!picture) return;

  limit();

  picture.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  picture.className = scale > 1 ? "grab" : "";
  level.textContent = Math.round(scale * 100) + " %";
}

/* Nicht weiter schieben, als Bild da ist. Sonst zieht man es aus dem Bild heraus
   und sieht schwarz, ohne zu wissen, wohin man geraten ist. */
function limit() {
  if (!picture) return;

  const bühne = stage.getBoundingClientRect();
  const breite = picture.clientWidth * scale;
  const höhe = picture.clientHeight * scale;

  const x = Math.max(0, (breite - bühne.width) / 2);
  const y = Math.max(0, (höhe - bühne.height) / 2);

  tx = clamp(tx, -x, x);
  ty = clamp(ty, -y, y);
}

function setZoom(next, cx, cy) {
  next = clamp(next, 1, 8);

  if (cx === undefined) {
    // Ohne Zielpunkt um die Mitte herum.
    const faktor = next / scale;
    tx *= faktor;
    ty *= faktor;
  } else {
    const bühne = stage.getBoundingClientRect();
    const px = cx - (bühne.left + bühne.width / 2);
    const py = cy - (bühne.top + bühne.height / 2);
    const faktor = next / scale;

    tx = px - faktor * (px - tx);
    ty = py - faktor * (py - ty);
  }

  scale = next;

  if (scale === 1) { tx = 0; ty = 0; }

  apply();
}

el("zoomIn").onclick = () => setZoom(scale * 1.5);
el("zoomOut").onclick = () => setZoom(scale / 1.5);
el("zoomReset").onclick = () => setZoom(1);

stage.addEventListener("wheel", event => {
  if (!picture) return;

  event.preventDefault();
  setZoom(scale * (event.deltaY < 0 ? 1.18 : 1 / 1.18), event.clientX, event.clientY);
}, { passive: false });

/* Ziehen und Zusammenkneifen über Zeiger-Ereignisse - dieselbe Behandlung für
   Maus und Finger, statt zweier Wege, die auseinanderlaufen. */
const zeiger = new Map();
let greifpunkt = null, kneifAbstand = 0, kneifStart = 1;

stage.addEventListener("pointerdown", event => {
  if (!picture) return;

  zeiger.set(event.pointerId, { x: event.clientX, y: event.clientY });
  stage.setPointerCapture(event.pointerId);

  if (zeiger.size === 1 && scale > 1) {
    greifpunkt = { x: event.clientX - tx, y: event.clientY - ty };
    picture.className = "grabbing";
  }

  if (zeiger.size === 2) {
    const [a, b] = Array.from(zeiger.values());
    kneifAbstand = Math.hypot(a.x - b.x, a.y - b.y);
    kneifStart = scale;
    greifpunkt = null;
  }
});

stage.addEventListener("pointermove", event => {
  if (!zeiger.has(event.pointerId)) return;

  zeiger.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (zeiger.size === 2) {
    const [a, b] = Array.from(zeiger.values());
    const jetzt = Math.hypot(a.x - b.x, a.y - b.y);

    if (kneifAbstand > 0) {
      setZoom(kneifStart * (jetzt / kneifAbstand), (a.x + b.x) / 2, (a.y + b.y) / 2);
    }

    return;
  }

  if (greifpunkt) {
    tx = event.clientX - greifpunkt.x;
    ty = event.clientY - greifpunkt.y;
    apply();
  }
});

function loslassen(event) {
  zeiger.delete(event.pointerId);

  if (zeiger.size < 2) kneifAbstand = 0;
  if (zeiger.size === 0) { greifpunkt = null; if (picture) picture.className = scale > 1 ? "grab" : ""; }
}

stage.addEventListener("pointerup", loslassen);
stage.addEventListener("pointercancel", loslassen);

addEventListener("resize", () => apply());

/* ------------------------------------------------------------------- Sichern */

el("save").onclick = () => {
  if (!lastJpeg) return;

  const nummer = lastState && lastState.frame !== undefined && lastState.frame !== null
    ? String(lastState.frame).padStart(4, "0")
    : "aktuell";

  const url = URL.createObjectURL(new Blob([lastJpeg], { type: "image/jpeg" }));
  const a = document.createElement("a");

  a.href = url;
  a.download = `frameflip_${nummer}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

el("forget").onclick = () => {
  keep(KEY_SECRET, "");
  keep(KEY_CODE, "");
  location.reload();
};

const Result = {
  Paired: "paired",    // drin, Kanal steht
  Taken: "taken",      // hier sitzt schon jemand
  Alone: "alone",      // Raum da, aber kein FrameFlip
  Blocked: "blocked",  // die Verbindung kam gar nicht erst zustande
  Broken: "broken",    // sie stand und ist abgerissen
  Wrong: "wrong"       // falscher Schluessel - Kennwort oder alter Link
};

/* Jede offene Verbindung dieser Seite.

   Sie werden mitgezaehlt, damit beim Verlassen der Seite wirklich alle zugehen.
   Ein Platz, den niemand mehr benutzt, aber auch niemand freigibt, ist aus Sicht
   des Leuchtturms besetzt - und der naechste Zuschauer steht davor. Auf einem Handy
   ist das der Normalfall und nicht die Ausnahme: Der Reiter wandert in den
   Hintergrund, die Verbindung bleibt und beantwortet brav jeden Ping. */
const live = new Set();

function drop(socket) {
  live.delete(socket);
  try { socket.close(); } catch (e) { /* war schon zu */ }
}

addEventListener("pagehide", () => {
  for (const socket of Array.from(live)) drop(socket);
});

/* Ein Versuch auf einem Platz.

   Aufgeloest wird mit ZWEI Dingen: dem Ausgang - und einem Versprechen, das erst
   faellt, wenn die Verbindung endet. Das zweite ist nicht Beiwerk. Ohne es weiss
   der aeussere Lauf nicht, wann er wieder anfangen soll; er suchte nach kurzer Pause
   munter weiter, waehrend er laengst verbunden war, faende seinen eigenen Platz als
   besetzt vor, naehme den naechsten - und haette nach ein paar Runden alle sechs
   Plaetze selbst belegt. Genau das ist passiert. */
function trySeat(room, seatKey) {
  return new Promise(resolve => {
    // Dasselbe Schema wie die Seite selbst. Steht sie auf https - und im Betrieb
    // tut sie das -, ist es wss. Auf dem eigenen Rechner zum Pruefen ist es ws.
    const scheme = location.protocol === "https:" ? "wss://" : "ws://";

    let socket;

    try {
      socket = new WebSocket(scheme + location.host + "/r/" + room + "?role=client");
    } catch (e) {
      resolve({ outcome: Result.Blocked, closed: Promise.resolve() });
      return;
    }

    socket.binaryType = "arraybuffer";
    live.add(socket);

    let channel = null, mySalt = null, theirSalt = null, confirmed = false;
    let settled = false;

    // Ob die Verbindung ueberhaupt zustande kam. Der Unterschied ist wichtig: Ein
    // Aufbau, der nie gelingt, ist etwas ganz anderes als ein belegter Platz - und
    // er darf niemals nach einem Kennwort fragen lassen.
    let opened = false;

    let ended;
    const closed = new Promise(fall => { ended = fall; });

    const done = outcome => {
      if (settled) return;
      settled = true;

      // Alles ausser dem Platz, den wir behalten wollen, wird SOFORT freigegeben.
      // Ein aufgegebener Versuch, dessen Verbindung offen bleibt, belegt einen Platz
      // fuer niemanden.
      if (outcome !== Result.Paired) drop(socket);

      resolve({ outcome, closed });
    };

    socket.onopen = () => { opened = true; };

    socket.onerror = () => done(opened ? Result.Broken : Result.Blocked);

    /* Nachrichten NACHEINANDER, nicht durcheinander.

       onmessage darf async sein - aber dann ruft der Browser es erneut auf, sobald
       der laufende Aufruf auf das erste await trifft. Und genau das passiert hier:
       Begruessung und Schluesselnachweis kommen dicht hintereinander, der Aufbau des
       Kanals braucht vier await. Trifft der Nachweis in dieses Fenster, gibt es den
       Kanal noch nicht; er faellt durch die Pruefung auf eine Begruessung, wird
       verworfen, und die Verbindung haengt fuer immer - ohne Fehler, ohne Meldung. */
    let pending = Promise.resolve();

    socket.onmessage = event => {
      pending = pending.then(() => handle(event)).catch(() => { /* eine kaputte Nachricht beendet nicht die Leitung */ });
    };

    socket.onclose = () => {
      live.delete(socket);

      // Hinten anstellen, nicht vordraengeln: Der Leuchtturm schickt seine
      // Abweisung als Text und schliesst unmittelbar danach. Wer hier sofort
      // entscheidet, kommt der noch wartenden Meldung zuvor und macht aus
      // "Platz belegt" ein "Schluessel falsch".
      pending = pending.then(() => {
        if (!opened) done(Result.Blocked);
        else {
          done(confirmed ? Result.Broken : Result.Wrong);
          if (confirmed) say("Verbindung verloren", "gone");
        }

        ended();
      });
    };

    async function handle(event) {
      // Text gehoert dem Leuchtturm, Binaer der Gegenseite. Der Rahmentyp
      // entscheidet, nie der Inhalt.
      if (typeof event.data === "string") {
        let control;
        try { control = JSON.parse(event.data); } catch (e) { return; }

        if (control.t === "error") {
          // "role already taken" heisst: hier sitzt schon jemand. Alles andere ist
          // eine Abweisung, die ein anderer Platz auch nicht heilt.
          done(/taken|full/i.test(control.why || "") ? Result.Taken : Result.Broken);
          return;
        }

        if (control.t === "waiting") {
          // Wir sind drin, aber FrameFlip nicht. Auf einem der freien Plaetze heisst
          // das: Das Programm laeuft nicht. Auf einem hinteren: Es ist kein Kennwort
          // gesetzt, also gibt es diesen Platz gar nicht.
          done(Result.Alone);
          return;
        }

        if (control.t === "peer" && control.up) {
          mySalt = crypto.getRandomValues(new Uint8Array(SALT_BYTES));

          const hello = new Uint8Array(1 + SALT_BYTES);
          hello[0] = VERSION;
          hello.set(mySalt, 1);

          socket.send(hello);
          return;
        }

        if (control.t === "peer" && !control.up) {
          say("FrameFlip ist weg", "gone");
          channel = null;
          confirmed = false;
        }

        return;
      }

      const data = new Uint8Array(event.data);

      /* --- 1. Die Begruessung der Gegenseite: offen, Fassung und Salz --- */
      if (!channel) {
        if (data.length !== 1 + SALT_BYTES || data[0] !== VERSION) return;

        theirSalt = data.subarray(1);
        channel = await Channel.establish(seatKey, theirSalt, mySalt);

        socket.send(await channel.seal(await confirmation(seatKey, false, theirSalt, mySalt)));
        return;
      }

      /* --- 2. Ihr Schluesselnachweis. Stimmt er nicht, ist es der falsche Schluessel --- */
      if (!confirmed) {
        const proof = await channel.open(data);
        const expected = await confirmation(seatKey, true, theirSalt, mySalt);

        if (!proof || !sameBytes(proof, expected)) {
          channel = null;
          done(Result.Wrong);
          return;
        }

        confirmed = true;
        done(Result.Paired);
        say("verbunden", "idle");
        return;
      }

      /* --- 3. Von hier an nur noch Nutzlast --- */
      const payload = await channel.open(data);
      if (!payload || payload.length < 1) return;

      const kind = payload[0];

      if (kind === KIND_JSON) {
        try { show(JSON.parse(new TextDecoder().decode(payload.subarray(1)))); }
        catch (e) { /* eine unleserliche Meldung ist kein Grund aufzuhoeren */ }
        return;
      }

      if (kind === KIND_PREVIEW && payload.length > 5) {
        showPicture(payload.subarray(5));   // 1 Byte Art, 4 Byte Bildnummer
      }
    }
  });
}

/* --------------------------------------------------------------- Platz suchen */

const ask = el("ask"), askForm = el("askForm"), askInput = el("askInput"), askWrong = el("askWrong");

function askForCode(message) {
  return new Promise(resolve => {
    // Erst leeren, dann fragen - sonst steht hinter der Abfrage noch, was eine
    // fruehere Verbindung geliefert hat.
    blank();

    askWrong.textContent = message || "";
    askInput.value = "";
    ask.classList.add("on");
    setTimeout(() => askInput.focus(), 50);

    askForm.onsubmit = event => {
      event.preventDefault();

      const typed = askInput.value.trim();
      if (!typed) return;

      ask.classList.remove("on");
      resolve(typed);
    };
  });
}

async function run() {
  const text = secretFromAddress();

  if (!text) {
    say("Link unvollständig", "gone");
    empty.textContent = "Dieser Link enthält kein Geheimnis. Am PC einen neuen erzeugen und ganz kopieren.";
    return;
  }

  let secret;
  try {
    secret = fromBase64Url(text);
    if (secret.length !== 32) throw new Error("Länge");
  } catch (e) {
    say("Link unbrauchbar", "gone");
    empty.textContent = "Mit diesem Link lässt sich nichts anfangen.";
    return;
  }

  const rooms = [];
  for (let seat = 0; seat < SEATS; seat++) {
    rooms.push(toHex(await hkdf(secret, ROOM_INFO, new Uint8Array([seat]), 16)));
  }

  const freeKey = await hkdf(secret, SEAT_INFO, new Uint8Array(0), 32);

  let code = rememberedCode();
  let codeKey = code ? await hkdf(secret, SEAT_INFO, enc.encode(code), 32) : null;
  let wait = 2000;

  for (;;) {
    let landed = false;

    // Wieviele Plaetze besetzt waren - getrennt nach frei und kennwortgeschuetzt.
    // Nur volle FREIE Plaetze rechtfertigen die Frage nach dem Kennwort. Frueher
    // fiel jeder andere Ausgang stillschweigend bis dorthin durch, und ein Browser,
    // der die Verbindung gar nicht zulaesst, sah damit aus wie ein volles Haus.
    let besetztFrei = 0, besetztGesamt = 0, versucht = 0;

    for (let seat = 0; seat < SEATS; seat++) {
      const protectedSeat = seat >= FREE_SEATS;

      if (protectedSeat && !codeKey) break;

      say(seat === 0 ? "verbinde …" : "suche freien Platz …");

      versucht++;

      const { outcome, closed } = await trySeat(rooms[seat], protectedSeat ? codeKey : freeKey);

      if (outcome === Result.Paired) {
        landed = true;
        wait = 2000;

        // HIER BLEIBEN, bis die Leitung endet.
        //
        // Ohne dieses Warten lief der aeussere Lauf sofort weiter, suchte nach
        // kurzer Pause erneut ab Platz 0, fand seinen eigenen Platz besetzt, nahm
        // den naechsten - und hatte nach ein paar Runden alle sechs Plaetze selbst
        // belegt. Fuer jeden anderen war dann kein Platz mehr frei.
        await closed;
        break;
      }

      if (outcome === Result.Taken) {
        besetztGesamt++;
        if (!protectedSeat) besetztFrei++;
        continue;
      }

      if (outcome === Result.Blocked) {
        say("Verbindung nicht möglich", "gone");
        empty.textContent = "Der Browser lässt die Verbindung zum Leuchtturm nicht zu, "
                          + "oder er ist gerade nicht erreichbar. Es wird weiter versucht.";
        landed = true;
        break;
      }

      if (outcome === Result.Alone) {
        if (!protectedSeat) {
          say("FrameFlip ist nicht erreichbar", "gone");
          empty.textContent = "FrameFlip läuft gerade nicht, oder das Zusehen ist dort abgeschaltet.";
        } else {
          // Ein hinterer Platz ohne FrameFlip heisst: Es ist kein Kennwort gesetzt.
          say("kein Platz frei", "gone");
          empty.textContent = "Es sehen schon zwei zu. Mehr lässt sich nur zulassen, "
                            + "wenn am PC ein Kennwort gesetzt wird.";
        }

        landed = true;   // Warten statt weitersuchen - die anderen Plaetze sind auch leer.
        break;
      }

      if (outcome === Result.Wrong && protectedSeat) {
        rememberCode("");
        code = await askForCode("Das war nicht das richtige Kennwort.");
        rememberCode(code);
        codeKey = await hkdf(secret, SEAT_INFO, enc.encode(code), 32);
        seat = FREE_SEATS - 1;   // die geschuetzten Plaetze noch einmal durchgehen
        continue;
      }

      if (outcome === Result.Wrong) {
        say("Link gilt nicht mehr", "gone");
        empty.textContent = "Dieser Link wurde erneuert. Am PC steht der aktuelle.";
        landed = true;
        break;
      }

      // Bleibt Result.Broken: Die Verbindung stand und riss ab. Nicht den naechsten
      // Platz belegen - abwarten und denselben noch einmal versuchen.
      say("Verbindung verloren", "gone");
      landed = true;
      break;
    }

    if (!landed) {
      // Alle freien Plaetze besetzt und noch kein Kennwort: dann eben danach fragen.
      if (!codeKey && besetztFrei >= FREE_SEATS) {
        code = await askForCode("");
        rememberCode(code);
        codeKey = await hkdf(secret, SEAT_INFO, enc.encode(code), 32);
        continue;
      }

      // Wirklich alles voll. Das laut sagen, statt still weiterzusuchen - sonst
      // steht man vor einer Seite, die ohne Grund nichts anzeigt.
      if (besetztGesamt >= versucht && versucht > 0) {
        say("kein Platz frei", "gone");
        empty.textContent = "Alle " + versucht + " Plätze sind gerade belegt. "
                          + "Sobald einer frei wird, geht es hier von selbst weiter.";
      }
    }

    say("neuer Versuch …", "gone");
    await new Promise(done => setTimeout(done, wait));
    wait = Math.min(wait * 2, 30000);
  }
}

run();

/* ------------------------------------------------------------ Installierbar

   Der Dienstarbeiter ist nicht dafuer da, Daten vorzuhalten - es gibt hier nichts
   vorzuhalten, was laenger als ein paar Sekunden gilt. Er haelt die Huelle bereit,
   damit sich die Seite als Programm ablegen laesst und beim Start sofort etwas da
   ist. Alles Lebendige kommt weiterhin ueber die verschluesselte Leitung.

   Schlaegt die Anmeldung fehl - altes Handy, abgeschaltet, privates Fenster -,
   laeuft die Seite unveraendert weiter. Sie laesst sich dann nur nicht ablegen. */
if ("serviceWorker" in navigator) {
  addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* dann eben ohne */ });
  });
}
</script>
